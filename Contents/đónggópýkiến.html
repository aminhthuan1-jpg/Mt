<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Đóng góp ý kiến</title>
</head>

<body>

<h2>ĐÓNG GÓP Ý KIẾN</h2>

<form action="#" method="post">
    
    <!-- Họ tên -->
    <label>Họ và tên:</label><br>
    <input type="text" name="hoten" required><br><br>

    <!-- Email -->
    <label>Email:</label><br>
    <input type="email" name="email" required><br><br>

    <!-- Giới tính -->
    <label>Giới tính:</label><br>
    <input type="radio" name="gioitinh" value="Nam"> Nam
    <input type="radio" name="gioitinh" value="Nữ"> Nữ<br><br>

    <!-- Nội dung góp ý -->
    <label>Nội dung góp ý:</label><br>
    <textarea name="ykien" rows="5" cols="40"></textarea><br><br>

    <!-- Nút -->
    <input type="submit" value="Gửi góp ý">
    <input type="reset" value="Nhập lại">

</form>

</body>
</html>
